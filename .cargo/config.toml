[target.xtensa-esp32-none-elf]
runner = "espflash flash --monitor --chip esp32 --baud 1000000 --flash-freq 80mhz"
linker = "xtensa-esp32-elf-gcc"
rustflags = [
  "-C", "force-frame-pointers=yes",
  "-C", "link-arg=-nostartfiles",
  # binutils warns once per binary that a LOAD segment is RWX. That is a
  # hosted-ELF hardening check: on these chips IRAM is executable *and*
  # written at runtime by design, so the layout is correct and the warning
  # is noise the linker scripts cannot avoid.
  "-C", "link-arg=-Wl,--no-warn-rwx-segments",
  # Warnings are errors. It lives HERE, not in a CI `RUSTFLAGS`, because that
  # env var REPLACES this array rather than appending to it — setting it would
  # silently drop the link args above and the build would fail for an unrelated
  # reason. Dependencies are unaffected: cargo caps lints on everything that is
  # not a path member.
  "-D", "warnings",
]

[target.xtensa-esp32s3-none-elf]
runner = "probe-rs run --chip=esp32s3 --preverify --always-print-stacktrace --no-location --catch-hardfault --idf-flash-freq 80mhz"
linker = "xtensa-esp32s3-elf-gcc"
rustflags = [
  "-C", "force-frame-pointers=yes",
  "-C", "link-arg=-nostartfiles",
  # binutils warns once per binary that a LOAD segment is RWX. That is a
  # hosted-ELF hardening check: on these chips IRAM is executable *and*
  # written at runtime by design, so the layout is correct and the warning
  # is noise the linker scripts cannot avoid.
  "-C", "link-arg=-Wl,--no-warn-rwx-segments",
  # Warnings are errors. It lives HERE, not in a CI `RUSTFLAGS`, because that
  # env var REPLACES this array rather than appending to it — setting it would
  # silently drop the link args above and the build would fail for an unrelated
  # reason. Dependencies are unaffected: cargo caps lints on everything that is
  # not a path member.
  "-D", "warnings",
]

[build]
target = "xtensa-esp32-none-elf"

[unstable]
build-std = ["alloc", "core"]

[env]
# Required by the `ex-lvgl` examples: oxivgl-sys compiles LVGL at
# build time and the application owns its `lv_conf.h`. Points at
# examples/conf/. Harmless for builds that don't enable `lvgl` (oxivgl-sys
# isn't compiled then). Resolved relative to this config file's directory.
DEP_LV_CONFIG_PATH = { value = "examples/conf", relative = true }
