[target.xtensa-esp32-none-elf]
runner = "espflash flash --monitor --chip esp32 --baud 1000000 --flash-freq 80mhz"
linker = "xtensa-esp32-elf-gcc"
rustflags = [
  "-C", "force-frame-pointers=yes",
  "-C", "link-arg=-nostartfiles",
]

[target.xtensa-esp32s3-none-elf]
runner = "probe-rs run --chip=esp32s3 --preverify --always-print-stacktrace --no-location --catch-hardfault --idf-flash-freq 80mhz"
linker = "xtensa-esp32s3-elf-gcc"
rustflags = [
  "-C", "force-frame-pointers=yes",
  "-C", "link-arg=-nostartfiles",
]

[build]
target = "xtensa-esp32-none-elf"

[unstable]
build-std = ["alloc", "core"]

[env]
# Required by the `lvgl-example` member: oxivgl-sys compiles LVGL at build time
# and the application owns its `lv_conf.h`. Points at examples/lvgl/conf/.
# Harmless for the other members (they don't depend on oxivgl-sys). Resolved
# relative to this config file's directory (the workspace root).
DEP_LV_CONFIG_PATH = { value = "examples/lvgl/conf", relative = true }
