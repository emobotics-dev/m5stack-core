# Caller stub for a target repo. Copy to .forgejo/workflows/ai-triage.yml
# in the target repo and adjust the allowlist in the "if:" below.
#
# The "uses:" must be a fully-qualified URL, not a bare owner/repo path -
# bare paths resolve against DEFAULT_ACTIONS_URL (data.forgejo.org) even
# for same-instance repos, not against this instance. Confirmed by testing
# directly (see docs/ai-automation.md).
#
# Also reacts to follow-up comments (not just the issue being opened), so
# an answer to an earlier open question gets a fresh analysis instead of
# going unprocessed. Excludes /implement, which is ai-implement's trigger -
# mutually exclusive by comment prefix, same shape as ai-automerge/
# ai-revise's mutual exclusivity by review type.
name: ai-triage

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  analyse:
    if: >
      (github.event_name == 'issues' && contains('emobotics,agent', github.event.issue.user.login)) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request == null &&
       !startsWith(github.event.comment.body, '/implement') &&
       contains('emobotics,agent', github.event.comment.user.login))
    runs-on: docker
    container:
      image: registry:3000/emobotics/forgejo-instance/ai-actions-ci:1
    steps:
      - uses: http://forgejo:3000/emobotics/forgejo-instance/.forgejo/actions/ai-triage@master
        with:
          claude_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
