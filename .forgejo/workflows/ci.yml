# SPDX-License-Identifier: BSD-3-Clause
# CI: build m5stack-core lib + examples for ESP32 and ESP32-S3.
#
# Runs inside registry:3000/emobotics/m5stack-core/m5stack-core-ci:v8 — this
# repo's own reference ESP-BSP CI image (built + pushed by build-ci-image.yml
# from .forgejo/docker/Dockerfile). It carries the dual-board Xtensa `esp`
# toolchain (esp32 + esp32s3) and — as of v3 — exports the full ESP cross-build
# environment (PATH, LIBCLANG_PATH, BINDGEN_EXTRA_CLANG_ARGS) directly, so this
# workflow needs no toolchain-plumbing step at all (see #11). Tags are immutable
# and the runner fleet shares one podman store, so bump the `:vN` tag here +
# in build-ci-image.yml + .devcontainer/Dockerfile in lockstep whenever the image
# is rebuilt (see forgejo-instance docs/runners.md).
#
# Self-hosted `rust`/`esp32` runners (runners 4–7 on wsdev2). The image is
# pulled anonymously from the Forgejo registry, so no credentials block is
# needed. The esp-hal / embedded-fatfs git deps are public GitHub forks and
# fetch anonymously; nothing needs a token.
#
# Concurrent legs behind one aggregate job, tuned for wall-clock on a fleet that
# is idle most of the time: each leg recompiles the dependency graph, trading
# ~2.2x the runner time for ~half the turnaround. Timings, why this grouping,
# and the caching follow-up are in #58.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    # NO base-branch filter. A `pull_request:` list here filters on the BASE,
    # and a base this list does not name means the build is not skipped but
    # never triggered at all — no failing check, no pending check, nothing on
    # the PR to notice. Stacking (conventions/git-workflow.md §7) makes any
    # branch a potential base, so an allow-list is a trap that has already
    # sprung: a PR stacked on a `fix/**` branch sat green-looking with no build
    # behind it, and was one command away from being merged that way.
    #
    # Listing every prefix instead would be the same trap with more entries.
    branches: ['**']
  workflow_dispatch:

# Cancel an in-flight run when a newer commit supersedes it (grouped per PR /
# branch ref). The self-hosted runner fleet is small (runners 4–7), so don't
# spend it building stale commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTUP_HOME: /opt/rustup
  CARGO_HOME: /opt/cargo
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  GIT_TERMINAL_PROMPT: "0"

jobs:
  # ── fire27 / ESP32 ──────────────────────────────────────────────────────────
  #
  # No toolchain-plumbing step in any leg: the m5stack-core-ci:v8 image exports
  # PATH (xtensa linkers), LIBCLANG_PATH and BINDGEN_EXTRA_CLANG_ARGS itself.
  # These green builds ARE the regression test that the image's exported env is
  # complete — if it weren't, they would fail with `linker not found` or bindgen
  # `inttypes.h not found` (see #11).
  fire27-lib:
    name: fire27 lib
    runs-on: [rust, esp32]
    container: registry:3000/emobotics/m5stack-core/m5stack-core-ci:v8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build lib (fire27 / ESP32)
        run: cargo build --release --features fire27

  fire27-full:
    name: fire27 all features
    runs-on: [rust, esp32]
    container: registry:3000/emobotics/m5stack-core/m5stack-core-ci:v8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build lib (fire27, all features)
        run: cargo build --release --features "fire27,display,buttons,psram,serial-cmd,search-masks,coex"

  fire27-examples:
    name: fire27 examples
    runs-on: [rust, esp32]
    container: registry:3000/emobotics/m5stack-core/m5stack-core-ci:v8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # `coex` is built on its own (`--example coex`): esp-radio's coexist blob
      # can't link into the non-BLE examples, so `ex-coex` must not be enabled
      # while building them. `ex-fire27`/`ex-cores3` are the board aggregates —
      # `required-features` can only gate an example, never enable anything.
      - name: Build examples (fire27 / ESP32)
        run: |
          cargo build --release --examples --no-default-features \
            --features "ex-fire27,ex-lvgl,ex-sd,ex-multicore"
          cargo build --release --example coex --no-default-features \
            --features "ex-fire27,ex-coex"
          cargo build --release --example probe_spi_cmd --no-default-features \
            --features "ex-fire27,ex-probes"
          cargo build --release --example probe_pps --no-default-features \
            --features "ex-fire27,ex-probes"

  # ── cores3 / ESP32-S3 ───────────────────────────────────────────────────────
  cores3-lib:
    name: cores3 lib
    runs-on: [rust, esp32]
    container: registry:3000/emobotics/m5stack-core/m5stack-core-ci:v8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build lib (cores3 / ESP32-S3)
        run: cargo build --release --features cores3 --target xtensa-esp32s3-none-elf

  cores3-full:
    name: cores3 all features
    runs-on: [rust, esp32]
    container: registry:3000/emobotics/m5stack-core/m5stack-core-ci:v8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build lib (cores3, all features)
        run: cargo build --release --features "cores3,display,buttons,psram,serial-cmd,search-masks,coex" --target xtensa-esp32s3-none-elf

  cores3-examples:
    name: cores3 examples
    runs-on: [rust, esp32]
    container: registry:3000/emobotics/m5stack-core/m5stack-core-ci:v8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # See the coex / lvgl note on the fire27 examples leg.
      - name: Build examples (cores3 / ESP32-S3)
        run: |
          cargo build --release --examples --no-default-features \
            --features "ex-cores3,ex-lvgl,ex-sd,ex-multicore" --target xtensa-esp32s3-none-elf
          cargo build --release --example coex --no-default-features \
            --features "ex-cores3,ex-coex" --target xtensa-esp32s3-none-elf
          cargo build --release --example probe_gdma_eof --no-default-features \
            --features "ex-cores3,ex-probes" --target xtensa-esp32s3-none-elf
          cargo build --release --example probe_pps --no-default-features \
            --features "ex-cores3,ex-probes" --target xtensa-esp32s3-none-elf

  # ── host crates ─────────────────────────────────────────────────────────────
  host:
    name: host crates
    runs-on: [rust, esp32]
    container: registry:3000/emobotics/m5stack-core/m5stack-core-ci:v8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Two HOST crates that no board leg builds: the harness is in its own
      # workspace, and `--workspace` reaches neither. Their logic needs no
      # board, so the full suites run here; tests that DO need one are
      # `#[ignore]`d and stay out. Without these both could rot unnoticed while
      # every board build stayed green.
      #
      # `working-directory`, NOT `--manifest-path` or `-p` from the root: cargo
      # reads .cargo/config.toml from the CURRENT DIRECTORY, so from the root
      # the Xtensa pin applies and a std crate dies with "can't find crate for
      # `std`". Being in the crate's directory is what lets its own config
      # (host target, build-std=["std"]) take effect.
      # `-D warnings` as RUSTFLAGS is safe for these two and NOT for the board
      # legs: the env var replaces `target.<triple>.rustflags` wholesale, and the
      # boards keep their linker args there (so theirs lives in .cargo/config.toml
      # instead). Nothing sets rustflags for the host target.
      - name: Test HIL harness (host)
        working-directory: m5stack-core-hil
        env:
          RUSTFLAGS: -D warnings
        run: cargo test

      - name: Test build helper (host)
        working-directory: m5stack-core-build
        env:
          RUSTFLAGS: -D warnings
        run: cargo test

  # ── formatting ──────────────────────────────────────────────────────────────
  fmt:
    name: rustfmt
    runs-on: [rust, esp32]
    container: registry:3000/emobotics/m5stack-core/m5stack-core-ci:v8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Three invocations because there are three workspaces: the BSP, and the
      # two host crates that `--workspace` does not reach. Without this leg the
      # tree drifts unnoticed — it had accumulated 429 diffs across 53 files
      # before anyone looked. `m5stack-core-hil` formats to its OWN
      # rustfmt.toml (wider, wrapped comments); the other two take rustfmt's
      # defaults, which is what that file says it intends.
      - name: rustfmt (BSP + examples)
        run: cargo fmt --check

      - name: rustfmt (HIL harness)
        working-directory: m5stack-core-hil
        run: cargo fmt --check

      - name: rustfmt (build helper)
        working-directory: m5stack-core-build
        run: cargo fmt --check

  # ── miri ────────────────────────────────────────────────────────────────────
  miri:
    name: miri (host crates)
    runs-on: [rust, esp32]
    container: registry:3000/emobotics/m5stack-core/m5stack-core-ci:v8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The host crates are the CEILING here, not a first instalment. The
      # library has no test target (`[lib] test = false`, no `#[cfg(test)]`
      # anywhere), so there is nothing to interpret; asking anyway dies in
      # esp-hal, where `&*Self::PTR` on a peripheral address is E0080 "dangling
      # reference ... has no provenance" — MMIO is not an allocation and cannot
      # become one under Miri's model. Examples are `#![no_main]`, so they carry
      # no test harness either. Note also what this leg does NOT cover: the only
      # `unsafe` in the repo is serial.rs's two ioctls, reachable solely through
      # a real tty, so every test that touches them is `#[ignore]`d.
      #
      # `cd /tmp` deliberately inverts the rule the `host` leg above states.
      # Miri builds its own MIR-only sysroot by running cargo in the CURRENT
      # DIRECTORY, so inside the repo it inherits `build-std` from
      # .cargo/config.toml, stacks it on the sysroot's own `core`, and dies with
      # E0464 "multiple candidates for `rmeta` dependency `core`". Outside the
      # tree no repo config applies — which is what is wanted, because nightly
      # ships a prebuilt host std and the build-std those crate configs exist to
      # provide is precisely what must not happen here.
      - name: Miri (build helper)
        run: cd /tmp && cargo +nightly miri test --manifest-path "$GITHUB_WORKSPACE/m5stack-core-build/Cargo.toml"

      # Isolation is disabled only here, and only because it is load-bearing: a
      # `flash` test opens a fixture file, which Miri refuses under isolation.
      # The build helper keeps the stricter default.
      - name: Miri (HIL harness)
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: cd /tmp && cargo +nightly miri test --manifest-path "$GITHUB_WORKSPACE/m5stack-core-hil/Cargo.toml"

  # DO NOT RENAME: master's protection requires this exact context string, so
  # renaming silently disarms the gate — a required check that stops existing
  # never reports, green by absence (#52). `if: always()` for the same reason: a
  # skipped aggregate reports nothing, so it runs and judges the legs itself.
  build:
    name: Build (ESP32 + ESP32-S3)
    if: always()
    needs:
      - fire27-lib
      - fire27-full
      - fire27-examples
      - cores3-lib
      - cores3-full
      - cores3-examples
      - host
      - miri
      - fmt
    runs-on: [rust, esp32]
    container: registry:3000/emobotics/m5stack-core/m5stack-core-ci:v8
    steps:
      - name: Verify every leg succeeded
        env:
          LEG_RESULTS: >-
            fire27-lib=${{ needs.fire27-lib.result }}
            fire27-full=${{ needs.fire27-full.result }}
            fire27-examples=${{ needs.fire27-examples.result }}
            cores3-lib=${{ needs.cores3-lib.result }}
            cores3-full=${{ needs.cores3-full.result }}
            cores3-examples=${{ needs.cores3-examples.result }}
            host=${{ needs.host.result }}
            miri=${{ needs.miri.result }}
            fmt=${{ needs.fmt.result }}
        run: |
          set -eu
          rc=0
          for entry in $LEG_RESULTS; do
            leg=${entry%%=*}
            result=${entry#*=}
            printf '%-18s %s\n' "$leg" "$result"
            [ "$result" = success ] || rc=1
          done
          if [ "$rc" -ne 0 ]; then
            echo "::error::at least one build leg did not succeed"
            exit 1
          fi
          echo "all legs succeeded"
