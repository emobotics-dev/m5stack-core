[package]
name = "m5stack-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
license = "MIT OR Apache-2.0"
description = "Board support crate for M5Stack Fire27 and CoreS3 (ESP32/ESP32-S3)"

[lib]
test = false
bench = false

[features]
fire27 = ["esp-hal/esp32", "esp-radio/esp32", "esp-sync/esp32", "esp-hal-rmt-onewire/esp32"]
cores3 = ["esp-hal/esp32s3", "esp-radio/esp32s3", "esp-sync/esp32s3", "esp-hal-rmt-onewire/esp32s3"]
# HIL serial-cmd driver — exposes a Read endpoint over UART0 (fire27) or
# USB-Serial-JTAG (cores3). Paired with `alternator-regulator/serial-cmd`.
serial-cmd = []
# External PSRAM heap support (the `mem` module). Enabling it activates a
# build-time guard requiring opt-level > 0 (build.rs) and the compile-time
# `PsramSafe` atomic check (uses the `esp` nightly auto-trait features).
psram = []

# --- Radio (driver::radio) — orthogonal to the chip features; combine per app.
# The radio is shared, so `coex` is required to run BLE and WiFi at once.
ble      = ["esp-radio/ble"]                                  # driver::radio::ble (BleRadio → BleConnector)
wifi     = ["esp-radio/wifi"]                                 # driver::radio::wifi (controller + scan)
wifi-sta = ["wifi", "dep:embassy-net", "dep:embassy-futures"] # STA + DHCP embassy_net::Stack
wifi-ap  = ["wifi", "dep:embassy-net", "dep:embassy-futures"] # reserved for AP mode (not yet implemented)
coex     = ["esp-radio/coex", "wifi", "ble"]                  # software WiFi/BLE coexistence (extra RAM)

[dependencies]
# esp-hal family
esp-alloc           = { git = "https://github.com/emobotics-dev/esp-hal.git", branch = "local" }
esp-hal             = { git = "https://github.com/emobotics-dev/esp-hal.git", branch = "local", features = ["unstable"] }
esp-radio           = { git = "https://github.com/emobotics-dev/esp-hal.git", branch = "local", features = ["esp-alloc", "unstable"] }
esp-sync            = { git = "https://github.com/emobotics-dev/esp-hal.git", branch = "local" }
esp-hal-rmt-onewire = { git = "https://github.com/emobotics-dev/esp-hal-rmt-onewire.git", branch = "local", default-features = false }

# embedded-hal family
embedded-hal        = "1.0.0"
embedded-io-async   = "0.7.0"

# Embassy
embassy-executor    = { version = "0.10.0", features = ["nightly"] }
embassy-futures     = { version = "0.1", optional = true }
embassy-net         = { version = "0.8.0", optional = true, default-features = false, features = ["dhcpv4", "proto-ipv4", "medium-ethernet", "tcp", "udp", "dns"] }
embassy-sync        = "0.8"
embassy-time        = "0.5.0"

# misc
allocator-api2      = { version = "0.3.0", default-features = false, features = ["alloc"] }
fixed               = "1.29.0"
heapless            = { version = "0.9.1", features = ["nightly"] }
log                 = "0.4"
static_cell         = { version = "2.1.1", features = ["nightly"] }
thiserror-no-std    = "2.0.2"

[patch.crates-io]
esp-hal                = { git = "https://github.com/emobotics-dev/esp-hal.git", branch = "local" }
esp-bootloader-esp-idf = { git = "https://github.com/emobotics-dev/esp-hal.git", branch = "local" }

[workspace]
members = ["examples/fire27", "examples/cores3"]

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = "s"
overflow-checks = true
