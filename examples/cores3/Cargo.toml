[package]
name = "cores3"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
publish = false

[[bin]]
name = "cores3"
path = "src/main.rs"
test = false
bench = false

[features]
# WiFi/BLE coexistence: run a BLE peer-MAC scanner alongside the WiFi station.
# Build with `--release` (the BLE deps trip a dev-profile xtensa codegen bug).
coex = ["m5stack-core/ble", "m5stack-core/coex", "dep:trouble-host", "dep:embassy-futures"]

[dependencies]
m5stack-core          = { path = "../../", features = ["cores3", "psram", "wifi-sta"] }

# esp-hal family
esp-alloc             = { git = "https://github.com/emobotics-dev/esp-hal.git", branch = "local", features = ["internal-heap-stats"] }
esp-bootloader-esp-idf = { git = "https://github.com/emobotics-dev/esp-hal.git", branch = "local", features = ["esp32s3"] }
esp-hal               = { git = "https://github.com/emobotics-dev/esp-hal.git", branch = "local", features = ["esp32s3", "unstable"] }
esp-rtos              = { git = "https://github.com/emobotics-dev/esp-hal.git", branch = "local", features = ["esp32s3", "embassy", "esp-radio", "log-04"] }
esp-sync              = { git = "https://github.com/emobotics-dev/esp-hal.git", branch = "local", features = ["esp32s3", "log-04"] }

# RTT (no esp-println/esp-backtrace on cores3 — conflicts with USB-JTAG)
panic-halt            = "1.0.0"
rtt-target            = "0.6.2"

# Embassy — match alternator-regulator's altreg-cores3 to avoid trait-bound
# skew when sharing types through m5stack-core (Spi: SetConfig,
# SpawnToken::spawn API).
embassy-embedded-hal  = { version = "0.6.0", features = ["time"] }
embassy-executor      = { version = "0.10.0", features = ["nightly", "log"] }
embassy-net           = { version = "0.8.0", default-features = false, features = ["dhcpv4", "proto-ipv4", "medium-ethernet", "tcp", "udp", "dns"] }
embassy-sync          = "0.8"
embassy-time          = { version = "0.5.0", features = ["log"] }

# Display
embedded-graphics     = "0.8.1"
lcd-async             = "0.1.1"

# misc
embedded-hal          = "1.0.0"
heapless              = "0.9.1"
static_cell           = { version = "2.1.1", features = ["nightly"] }

# BLE (coex only). trouble-host 0.6 tracks bt-hci 0.8 — matching esp-radio on
# this esp-hal 1.1 line (the local-0.5.0 fork is bt-hci 0.6 and won't bind to
# esp-radio's BleConnector).
embassy-futures       = { version = "0.1", optional = true }
trouble-host          = { version = "0.6.0", features = ["default-packet-pool-mtu-255", "scan", "derive"], optional = true }

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = "s"
overflow-checks = true

