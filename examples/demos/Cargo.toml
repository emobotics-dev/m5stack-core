# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "demos"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
publish = false

[lib]
name = "demos"
path = "src/lib.rs"
test = false
bench = false

# One focused, copy-pasteable binary per topic — unified across both boards
# (select with `--features fire27` (default) or `--no-default-features
# --features cores3`). `lvgl`/`coex` are gated by `required-features` so a plain
# `cargo build -p demos` (and `--workspace`) skips them — leaving the `coex`
# feature OFF, which matters: esp-radio's coexist blob is a crate-global link
# dependency that only the BLE-initialising `coex` bin can satisfy, so the coex
# bin MUST be built on its own (`--bin coex --features coex`). `onewire` is
# ESP32-only (auto-excluded on a cores3 build).
[[bin]]
name = "display"
path = "src/bin/display.rs"
test = false
bench = false

[[bin]]
name = "i2c_scan"
path = "src/bin/i2c_scan.rs"
test = false
bench = false

[[bin]]
name = "m5go"
path = "src/bin/m5go.rs"
test = false
bench = false

[[bin]]
name = "wifi_sta"
path = "src/bin/wifi_sta.rs"
test = false
bench = false

[[bin]]
name = "onewire"
path = "src/bin/onewire.rs"
test = false
bench = false
required-features = ["fire27"]

[[bin]]
name = "lvgl"
path = "src/bin/lvgl.rs"
test = false
bench = false
required-features = ["lvgl"]

# SD card over the shared SPI2 bus (display + SD): mount the FAT filesystem and
# list the root directory. Gated by `sd` (pulls the sdspi/embedded-fatfs fork).
[[bin]]
name = "sd"
path = "src/bin/sd.rs"
test = false
bench = false
required-features = ["sd"]

# WiFi+BLE coexistence — gated so it's only built when explicitly requested
# (`--bin coex --features coex`); enabling `coex` while building the other bins
# fails to link (esp-radio coexist blob needs the BT controller).
[[bin]]
name = "coex"
path = "src/bin/coex.rs"
test = false
bench = false
required-features = ["coex"]

# Multicore harness demo — runs a task on the APP core via board::run_app_core.
[[bin]]
name = "multicore"
path = "src/bin/multicore.rs"
test = false
bench = false
required-features = ["multicore"]

[features]
# Exactly one board feature; `default = ["fire27"]` keeps the bare
# `cargo build -p demos` building for the Fire27 (ESP32). The chip is
# propagated to the whole esp-hal family here so no dep hardcodes a chip.
default = ["fire27"]
# Logging + panic now come from the BSP console (m5stack-core/console-serial +
# /panic-handler), so no esp-println/esp-backtrace (fire27) or panic-halt/
# rtt-target (cores3) — the bins carry no panic boilerplate and log over the
# chip's native transport (UART0 / USB-Serial-JTAG CDC).
fire27 = [
    "esp-hal/esp32",
    "esp-bootloader-esp-idf/esp32",
    "esp-rtos/esp32",
    "esp-sync/esp32",
    "dep:m5stack-core",
    "m5stack-core/fire27",
    "m5stack-core/display",
    "m5stack-core/buttons",
    "m5stack-core/psram",
    "m5stack-core/wifi-sta",
    "m5stack-core/console-serial",
    "m5stack-core/panic-handler",
]
cores3 = [
    "esp-hal/esp32s3",
    "esp-bootloader-esp-idf/esp32s3",
    "esp-rtos/esp32s3",
    "esp-rtos/log-04",
    "esp-sync/esp32s3",
    "esp-sync/log-04",
    "embassy-executor/log",
    "embassy-time/log",
    "dep:m5stack-core",
    "m5stack-core/cores3",
    "m5stack-core/display",
    "m5stack-core/psram",
    "m5stack-core/wifi-sta",
    "m5stack-core/console-serial",
    "m5stack-core/panic-handler",
]
# The LVGL (oxivgl) UI demo. Gated so the simple bins don't pay the LVGL C
# build. oxivgl-sys compiles LVGL at build time (needs network + libclang and
# the `DEP_LV_CONFIG_PATH` env in .cargo/config.toml → examples/demos/conf).
lvgl = ["dep:oxivgl", "dep:oxivgl-sys"]
# WiFi+BLE coexistence (the `coex` bin only). Build with `--bin coex` — see the
# coex [[bin]] note. Pulls the BLE host stack + the radio coex feature.
coex = ["m5stack-core/coex", "m5stack-core/ble", "dep:trouble-host", "dep:embassy-futures"]
# SD-card demo (the `sd` bin only): the sdspi + embedded-fatfs fork over the
# shared display+SD bus (`board::spi2::finish`).
sd = ["dep:sdspi", "dep:embedded-fatfs", "dep:block-device-adapters", "dep:aligned", "dep:embedded-io-async", "dep:embedded-hal-async"]
# Multicore demo (the `multicore` bin only): board::run_app_core puts a task on
# the APP core. Pulls m5stack-core/multicore (the esp-rtos InterruptExecutor).
multicore = ["m5stack-core/multicore"]

[dependencies]
common               = { path = "../common" }
# m5stack-core — board/display drivers + the unified IO loops. Optional +
# default-features off; each board feature turns on its chip + the BSP features
# the bins use (display, buttons, psram, wifi-sta).
m5stack-core         = { path = "../../", optional = true, default-features = false }

# esp-hal family (fork) — chip features supplied per board via [features].
# esp-backtrace + esp-println are Fire27-only (UART); panic-halt + rtt-target
# are CoreS3-only (USB-Serial-JTAG, which esp-println/esp-backtrace conflict
# with).
esp-alloc            = { workspace = true }
esp-backtrace        = { workspace = true, optional = true }
esp-bootloader-esp-idf = { workspace = true }
esp-hal              = { workspace = true }
esp-println          = { workspace = true, optional = true }
esp-rtos             = { workspace = true }
esp-sync             = { workspace = true }
panic-halt           = { workspace = true, optional = true }
rtt-target           = { workspace = true, optional = true }

# Embassy
embassy-embedded-hal = { workspace = true }
embassy-executor     = { workspace = true }
embassy-net          = { workspace = true }
embassy-sync         = { workspace = true }
embassy-time         = { workspace = true }

# Display
embedded-graphics    = { workspace = true }
lcd-async            = { workspace = true }

# BLE (coex bin only)
embassy-futures      = { workspace = true, optional = true }
trouble-host         = { workspace = true, optional = true }

# SD card (sd bin only) — the emobotics fork of embedded-fatfs (sdspi + FAT),
# pinned by rev like the esp-hal fork. Not on crates.io, so example-only.
sdspi                 = { git = "https://github.com/emobotics-dev/embedded-fatfs.git", rev = "eada6e7e6494577429d8799516c3fd32b7a1d9bb", features = ["log"], optional = true }
embedded-fatfs        = { git = "https://github.com/emobotics-dev/embedded-fatfs.git", rev = "eada6e7e6494577429d8799516c3fd32b7a1d9bb", default-features = false, features = ["alloc", "lfn", "log"], optional = true }
block-device-adapters = { git = "https://github.com/emobotics-dev/embedded-fatfs.git", rev = "eada6e7e6494577429d8799516c3fd32b7a1d9bb", optional = true }
aligned               = { version = "0.4.2", optional = true }
# embedded-io-async 0.7 to match the embedded-fatfs fork's `local` rev
# (block-device-adapters bumped 0.6 → 0.7). embedded-hal-async for the generic
# SpiDevice bound (sdspi uses "1").
embedded-io-async     = { version = "0.7", optional = true }
embedded-hal-async    = { version = "1", optional = true }

# misc
embedded-hal         = { workspace = true }
heapless             = { workspace = true }
log                  = { workspace = true }
static_cell          = { workspace = true }

# LVGL UI (lvgl feature only)
oxivgl               = { workspace = true, optional = true }
oxivgl-sys           = { workspace = true, optional = true }
