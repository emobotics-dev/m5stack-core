# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "demos"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
name = "demos"
path = "src/lib.rs"
test = false
bench = false

# One focused, copy-pasteable binary per topic — unified across both boards
# (select with `--features fire27` (default) or `--no-default-features
# --features cores3`). `lvgl`/`coex` are gated by `required-features` so a plain
# `cargo build -p demos` (and `--workspace`) skips them — leaving the `coex`
# feature OFF, which matters: esp-radio's coexist blob is a crate-global link
# dependency that only the BLE-initialising `coex` bin can satisfy, so the coex
# bin MUST be built on its own (`--bin coex --features coex`). `onewire` is
# ESP32-only (auto-excluded on a cores3 build).
[[bin]]
name = "display"
path = "src/bin/display.rs"
test = false
bench = false

[[bin]]
name = "i2c_scan"
path = "src/bin/i2c_scan.rs"
test = false
bench = false

[[bin]]
name = "m5go"
path = "src/bin/m5go.rs"
test = false
bench = false

[[bin]]
name = "wifi_sta"
path = "src/bin/wifi_sta.rs"
test = false
bench = false

[[bin]]
name = "psram_split"
path = "src/bin/psram_split.rs"
test = false
bench = false

[[bin]]
name = "onewire"
path = "src/bin/onewire.rs"
test = false
bench = false
required-features = ["fire27"]

[[bin]]
name = "lvgl"
path = "src/bin/lvgl.rs"
test = false
bench = false
required-features = ["lvgl"]

# SD card over the shared SPI2 bus (display + SD): mount the FAT filesystem and
# list the root directory. Gated by `sd` (pulls the sdspi/embedded-fatfs fork).
# The LVGL threading pattern on its own — the version to copy. No scheduling
# feature: the pattern is unconditional here, and oxivgl picks the flush context
# by constructor rather than by cfg. `lvgl_sched` is the harness that measured it.
[[bin]]
name = "lvgl_threads"
path = "src/bin/lvgl_threads.rs"
test = false
bench = false
required-features = ["lvgl"]

# LVGL scheduling A/B (#63): the same gauge load under three placements of the
# render loop and flush. See the bin's module docs for the feature matrix.
[[bin]]
name = "lvgl_sched"
path = "src/bin/lvgl_sched.rs"
test = false
bench = false
required-features = ["lvgl"]

[[bin]]
name = "sd"
path = "src/bin/sd.rs"
test = false
bench = false
required-features = ["sd"]

# WiFi+BLE coexistence — gated so it's only built when explicitly requested
# (`--bin coex --features coex`); enabling `coex` while building the other bins
# fails to link (esp-radio coexist blob needs the BT controller).
[[bin]]
name = "coex"
path = "src/bin/coex.rs"
test = false
bench = false
required-features = ["coex"]

# SPI command-phase wire probe (#18): SPI2 master -> three free M-Bus pads ->
# SPI3 DMA slave, looped through the GPIO matrix, so the slave captures the
# literal bits the master emits — command phase included. No wiring, no
# analyzer. Build: `--bin spi_cmd_probe`.
[[bin]]
name = "spi_cmd_probe"
path = "src/bin/spi_cmd_probe.rs"
test = false
bench = false

# GDMA IN_SUC_EOF-vs-TRANS_DONE timing probe (#16): is IN_SUC_EOF already set
# when SPI_TRANS_DONE fires for a DMA read? ESP32-S3 only — its GDMA register
# path is chip-specific. Build: `--bin gdma_eof_probe --no-default-features
# --features cores3`.
[[bin]]
name = "gdma_eof_probe"
path = "src/bin/gdma_eof_probe.rs"
test = false
bench = false
required-features = ["cores3"]

# SPI2/GDMA fault-termination probe (#17): induces a TX underrun mid-transfer
# (GDMA_OUT_LINK.OUTLINK_STOP) and characterises whether SPI_USR wedges with
# no interrupt, then works through a 3-rung recovery ladder. ESP32-S3 only.
# Build: `--bin spi2_gdma_fault_probe --no-default-features --features cores3`.
[[bin]]
name = "spi2_gdma_fault_probe"
path = "src/bin/spi2_gdma_fault_probe.rs"
test = false
bench = false
required-features = ["cores3"]

# GDMA clear_all() completeness probe (#19): latches a FIFO overflow bit that
# DmaRxInterrupt/DmaTxInterrupt cannot name, runs a Mem2Mem transfer (which
# calls clear_all() internally) and reports what survived. CoreS3 only — GDMA.
# Build: `--bin dma_int_probe --no-default-features --features cores3`.
[[bin]]
name = "dma_int_probe"
path = "src/bin/dma_int_probe.rs"
test = false
bench = false
required-features = ["cores3"]

# I2C-NACK / IRQ-core-contention repro harness (#3 / #10 investigation): async
# I2C completion-IRQ flood on an absent address + BLE scanner + WiFi STA, all on
# the PRO core, to probe the I2C-completion-IRQ vs RWBLE same-core level-1
# contention theory. #10 closed as not reproducible on the current stack (real
# cause lives in esp-rtos/esp-radio, not esp-hal) — kept as a reusable harness
# for #3's still-open field-verification gap. Build: `--bin nack_repro --features coex`.
[[bin]]
name = "nack_repro"
path = "src/bin/nack_repro.rs"
test = false
bench = false
required-features = ["coex"]

# Multicore harness demo — runs a task on the APP core via board::run_app_core.
[[bin]]
name = "multicore"
path = "src/bin/multicore.rs"
test = false
bench = false
required-features = ["multicore"]

[features]
# Exactly one board feature; `default = ["fire27"]` keeps the bare
# `cargo build -p demos` building for the Fire27 (ESP32). The chip is
# propagated to the whole esp-hal family here so no dep hardcodes a chip.
default = ["fire27"]
# Logging + panic now come from the BSP console (m5stack-core/console-serial +
# /panic-handler), so no esp-println/esp-backtrace (fire27) or panic-halt/
# rtt-target (cores3) — the bins carry no panic boilerplate and log over the
# chip's native transport (UART0 / USB-Serial-JTAG CDC).
fire27 = [
    "esp-hal/esp32",
    "esp-bootloader-esp-idf/esp32",
    "esp-rtos/esp32",
    "esp-sync/esp32",
    "dep:m5stack-core",
    "m5stack-core/fire27",
    "m5stack-core/display",
    "m5stack-core/buttons",
    "m5stack-core/psram",
    "m5stack-core/wifi-sta",
    "m5stack-core/console-serial",
    "m5stack-core/panic-handler",
]
cores3 = [
    "esp-hal/esp32s3",
    "esp-bootloader-esp-idf/esp32s3",
    "esp-rtos/esp32s3",
    "esp-rtos/log-04",
    "esp-sync/esp32s3",
    "esp-sync/log-04",
    "embassy-executor/log",
    "embassy-time/log",
    "dep:m5stack-core",
    "m5stack-core/cores3",
    "m5stack-core/display",
    "m5stack-core/psram",
    "m5stack-core/wifi-sta",
    "m5stack-core/console-serial",
    "m5stack-core/panic-handler",
]
# The LVGL (oxivgl) UI demo. Gated so the simple bins don't pay the LVGL C
# build. oxivgl-sys compiles LVGL at build time (needs network + libclang and
# the `DEP_LV_CONFIG_PATH` env in .cargo/config.toml → examples/demos/conf).
lvgl = ["dep:oxivgl", "dep:oxivgl-sys"]
# Scheduling variants of the `lvgl_sched` bin (#63) — the A/B knobs, not the
# pattern; `lvgl_threads` needs none of them. Features, not an env var, so the
# crate fingerprint changes and a stale binary cannot be measured by mistake.
# `ui-thread` moves the render loop to its own esp-rtos thread and raises the app
# executor above it; `ui-flush-thread` additionally moves the flush off the
# interrupt executor, so the UI can no longer preempt anything via hardware.
ui-thread = []
ui-flush-thread = ["ui-thread"]
# Put the render thread on the APP core, leaving PRO to the app/protocol work.
# LVGL stays single-threaded — every LVGL call is made by that one thread, it
# simply lives on the other core.
ui-app-core = ["ui-flush-thread"]
# WiFi+BLE coexistence (the `coex` bin only). Build with `--bin coex` — see the
# coex [[bin]] note. Pulls the BLE host stack + the radio coex feature.
coex = ["m5stack-core/coex", "m5stack-core/ble", "dep:trouble-host", "dep:embassy-futures"]
# SD-card demo (the `sd` bin only): the sdspi + embedded-fatfs fork over the
# shared display+SD bus (`board::spi2::finish`).
sd = ["dep:sdspi", "dep:embedded-fatfs", "dep:block-device-adapters", "dep:aligned", "dep:embedded-io-async", "dep:embedded-hal-async"]
# Multicore demo (the `multicore` bin only): board::run_app_core puts a task on
# the APP core. Pulls m5stack-core/multicore (the esp-rtos InterruptExecutor).
multicore = ["m5stack-core/multicore"]
# Bench regression: enable the BSP's AW9523B cold-boot fault injection. Build any
# cores3 demo (e.g. `display`) with this feature + `M5_TEST_AW_NACK=N` and watch
# for "AW9523B ready after N retries" — verifies the cold-boot retry recovery
# without a power cycle (the rig can't switch USB VBUS).
test-fault-inject = ["m5stack-core/test-fault-inject"]
# Enforced firmware build identity (m5stack-core#43): app_desc!()'s version
# field becomes this build's git commit + dirty state instead of plain
# CARGO_PKG_VERSION. build.rs emits it via m5stack-core-build; forgetting that
# wiring while this feature is on is a compile error (env!() has nothing to
# read), not a silent gap — see m5stack-core's `identity` feature docs.
identity = ["dep:m5stack-core-build", "m5stack-core/identity"]

[dependencies]
common               = { path = "../common" }
# m5stack-core — board/display drivers + the unified IO loops. Optional +
# default-features off; each board feature turns on its chip + the BSP features
# the bins use (display, buttons, psram, wifi-sta).
m5stack-core         = { path = "../../", optional = true, default-features = false }

# esp-hal family (fork) — chip features supplied per board via [features].
# esp-backtrace + esp-println are Fire27-only (UART); panic-halt + rtt-target
# are CoreS3-only (USB-Serial-JTAG, which esp-println/esp-backtrace conflict
# with).
esp-alloc            = { workspace = true }
esp-backtrace        = { workspace = true, optional = true }
esp-bootloader-esp-idf = { workspace = true }
esp-hal              = { workspace = true }
esp-println          = { workspace = true, optional = true }
esp-rtos             = { workspace = true }
esp-radio-rtos-driver = { workspace = true }
esp-sync             = { workspace = true }
panic-halt           = { workspace = true, optional = true }
rtt-target           = { workspace = true, optional = true }

# Embassy
embassy-embedded-hal = { workspace = true }
embassy-executor     = { workspace = true }
embassy-net          = { workspace = true }
embassy-sync         = { workspace = true }
embassy-time         = { workspace = true }

# Display
embedded-graphics    = { workspace = true }
lcd-async            = { workspace = true }

# BLE (coex bin only)
embassy-futures      = { workspace = true, optional = true }
trouble-host         = { workspace = true, optional = true }

# SD card (sd bin only) — the emobotics fork of embedded-fatfs (sdspi + FAT),
# pinned by rev like the esp-hal fork. Not on crates.io, so example-only.
sdspi                 = { git = "https://github.com/emobotics-dev/embedded-fatfs.git", rev = "4565a3e3358e1b03c12b7f1b8c04483facbc45b9", features = ["log"], optional = true }
embedded-fatfs        = { git = "https://github.com/emobotics-dev/embedded-fatfs.git", rev = "4565a3e3358e1b03c12b7f1b8c04483facbc45b9", default-features = false, features = ["alloc", "lfn", "log"], optional = true }
block-device-adapters = { git = "https://github.com/emobotics-dev/embedded-fatfs.git", rev = "4565a3e3358e1b03c12b7f1b8c04483facbc45b9", optional = true }
aligned               = { version = "0.4.2", optional = true }
# embedded-io-async 0.7 to match the embedded-fatfs fork's `local` rev
# (block-device-adapters bumped 0.6 → 0.7). embedded-hal-async for the generic
# SpiDevice bound (sdspi uses "1").
embedded-io-async     = { version = "0.7", optional = true }
embedded-hal-async    = { version = "1", optional = true }

# misc
embedded-hal         = { workspace = true }
heapless             = { workspace = true }
log                  = { workspace = true }
static_cell          = { workspace = true }

# LVGL UI (lvgl feature only)
oxivgl               = { workspace = true, optional = true }
oxivgl-sys           = { workspace = true, optional = true }

[build-dependencies]
# identity feature only — emits M5STACK_CORE_BUILD_MARK from this build's git
# state. See m5stack-core::app_desc! and the identity feature docs.
m5stack-core-build   = { path = "../../m5stack-core-build", optional = true }
