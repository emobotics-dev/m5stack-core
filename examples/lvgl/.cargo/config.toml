#
# oxivgl-sys requires DEP_LV_CONFIG_PATH to point at a directory containing
# `lv_conf.h` (the application owns the LVGL config — see oxivgl's CLAUDE.md).
# This crate ships its own copy in `conf/`. The path is resolved relative to
# this config file's parent directory (i.e. examples/lvgl/).
#
# Target / linker / build-std settings are inherited from the workspace-root
# `.cargo/config.toml` (Cargo merges configs from the crate dir upward).
[env]
DEP_LV_CONFIG_PATH = { value = "conf", relative = true }
