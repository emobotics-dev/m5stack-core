#
# This is a HOST crate: it runs inside a consumer's `build.rs`, on the machine
# doing the building, and is never linked into firmware. The repo root's
# `.cargo/config.toml` pins `target = "xtensa-esp32-none-elf"`, and cargo merges
# config by DIRECTORY hierarchy — so without this file `cargo test` here
# cross-compiles the crate to the board and dies on the first `std` import.
#
# That is not hypothetical: before this file existed, `cargo test -p
# m5stack-core-build` had NEVER been able to run. The tests were written, were
# committed, and could not compile. Nearest config wins, so naming the host
# target here is the whole fix.
[build]
target = "x86_64-unknown-linux-gnu"

# The root config also sets `build-std = ["alloc", "core"]` for the board, and
# that is inherited here too. Left alone it rebuilds `core` for the host on top
# of the `core` the host toolchain already ships, and the compile dies with
# "duplicate lang item in crate `core`: sized".
#
# Same resolution as `m5stack-core-hil`, for the same reason.
[unstable]
build-std = ["std"]
